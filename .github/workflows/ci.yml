name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  # Vet, build every package (including cmd/notifyd), and enforce a 100%
  # statement-coverage gate on the library packages. cmd/notifyd is excluded
  # from the coverage gate: it is a session-bus + display binary whose main
  # loop cannot run in headless CI (it is compile-verified only).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: go version
      - name: Vet
        run: CGO_ENABLED=0 go vet ./...
      - name: Build (all packages)
        run: CGO_ENABLED=0 go build ./...
      - name: Test + 100% coverage gate (library packages)
        # -race requires cgo, so enable it for THIS step only; every other
        # step stays CGO-free.
        env:
          CGO_ENABLED: "1"
        shell: bash
        run: |
          PKGS=$(go list ./... | grep -v '/cmd/')
          COVERPKG=$(echo "$PKGS" | paste -sd, -)
          go test -race -covermode=atomic -coverpkg="$COVERPKG" -coverprofile=cover.out $PKGS
          go tool cover -func=cover.out | tail -n 30
          cov=$(go tool cover -func=cover.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "coverage: ${cov}%"
          awk -v p="$cov" 'BEGIN { exit (p+0 < 100.0) ? 1 : 0 }' || {
            echo "::error::coverage ${cov}% < 100%"; exit 1; }

  # The six supported 64-bit targets. amd64/arm64 run the suite natively; the
  # rest run it under qemu-user. All CGO-free.
  arch-native:
    name: arch ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: amd64 }
          - { os: ubuntu-24.04-arm, label: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: CGO_ENABLED=0 go test ./...

  arch-qemu:
    name: arch ${{ matrix.goarch }} (qemu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: riscv64, qemu: qemu-riscv64-static }
          - { goarch: loong64, qemu: qemu-loongarch64-static }
          - { goarch: ppc64le, qemu: qemu-ppc64le-static }
          - { goarch: s390x, qemu: qemu-s390x-static }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - name: Test under qemu (${{ matrix.goarch }})
        run: CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go test -exec=${{ matrix.qemu }} ./...
